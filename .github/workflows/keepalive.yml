name: Keep schedule alive
# GitHub pauses scheduled workflows in public repos after 60 days without repository activity, and refresh.yml never commits.
on:
  schedule:
    - cron: '41 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit --allow-empty -m "Keep schedule alive"
          git push
