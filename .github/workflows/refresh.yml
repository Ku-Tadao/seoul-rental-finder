name: Refresh listings
on:
  schedule:
    # Hourly: every source now finishes its list pass in minutes, so new listings show up within the hour. A long backfill carries on over several runs.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Scrape time limit in minutes
        default: '50'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: refresh
  cancel-in-progress: false
env:
  # Raw data stays in the private Actions cache because its free text still holds agent contact details; only the scrubbed site is published.
  STATE: |
    *.jsonl
    dabang_rentals.json
    zigbang_ids.json
    zigbang_danjis.json
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.STATE }}
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Scrape
        run: timeout "$(( ${{ inputs.minutes || 50 }} * 60 ))" bash refresh.sh || true
      - name: Drop torn lines and removed listings
        run: |
          node compact_jsonl.js dabang_details.jsonl dabang_rentals.json
          node compact_jsonl.js zigbang_rentals.jsonl zigbang_ids.json
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ env.STATE }}
          key: state-${{ github.run_id }}
  publish:
    needs: scrape
    uses: ./.github/workflows/site.yml
